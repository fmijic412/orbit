<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Runner</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <span id="score">Score: 0</span>
      <span id="best">Best: 0</span>
      <span id="time">Time: 60</span>
      <span id="hint">WASD / Arrows to move &middot; collect the glowing orbs</span>
    </div>
    <div id="combo" class="hidden">
      <span id="combo-mult">x2</span>
      <div id="combo-bar"><div id="combo-bar-fill"></div></div>
    </div>
    <canvas id="game"></canvas>
    <div id="end-screen" class="hidden">
      <div id="end-panel">
        <h1>Time's up!</h1>
        <p id="final-score">Final score: 0</p>
        <p id="new-best" class="hidden">New best!</p>
        <button id="play-again" type="button">Play again</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
